[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ptsq"
version = "0.1.0"
description = "Privacy-Tiered Semantic Query processing across device, edge and cloud LLMs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6", "httpx>=0.27", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
rl = ["torch>=2.1"]
device = ["torch>=2.1", "transformers>=4.44", "peft>=0.12", "accelerate>=0.33"]
# Jetson (JetPack 6.x ships torch 2.5): newer transformers refuse torch < 2.6
jetson = ["transformers>=4.45,<4.50", "peft>=0.12,<0.15", "accelerate>=0.33,<1.5", "datasets>=3.0,<4.0"]
data = ["datasets>=2.20"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ptsq*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
